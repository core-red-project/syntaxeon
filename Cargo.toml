[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Core Red Project"]
repository = "https://github.com/core-red-project/syntaxeon"
homepage = "https://github.com/core-red-project/syntaxeon"
readme = "README.md"
keywords = ["esoteric", "programming-language", "rhyme", "poetry", "interpreter"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
syntaxeon-analysis = { path = "crates/syntaxeon-analysis", version = "0.0.1" }
syntaxeon-check = { path = "crates/syntaxeon-check", version = "0.0.1" }
syntaxeon-core = { path = "crates/syntaxeon-core", version = "0.0.1" }
syntaxeon-eval = { path = "crates/syntaxeon-eval", version = "0.0.1" }
syntaxeon-lex = { path = "crates/syntaxeon-lex", version = "0.0.1" }
syntaxeon-lexicon = { path = "crates/syntaxeon-lexicon", version = "0.0.1" }
syntaxeon-syntax = { path = "crates/syntaxeon-syntax", version = "0.0.1" }

# External, used only by the language server.
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Fallible functions return diagnostic types that already describe the failure.
missing_errors_doc = "allow"
# Panics are denied by unwrap_used/expect_used, so there is nothing left to document.
missing_panics_doc = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1
